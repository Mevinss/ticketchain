<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1530" viewBox="0 0 1760 1530">
<rect width="100%" height="100%" fill="#f2f5fa"/>
<text x="65" y="60.24" fill="#2563eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">TICKETCHAIN</text>
<text x="65" y="126.16" fill="#0f172a" font-family="Arial, sans-serif" font-size="48" font-weight="700">System architecture</text>
<text x="65" y="170.08" fill="#334155" font-family="Arial, sans-serif" font-size="24" font-weight="400">Current implementation · Solidity 0.8.24 · Remix-first educational prototype</text>
<text x="65" y="228.4" fill="#64748b" font-family="Arial, sans-serif" font-size="20" font-weight="700">01  ACTORS</text>
<rect x="65" y="250" width="520" height="135" rx="18" fill="#ffffff" stroke="#d7e0ed" stroke-width="2"/>
<text x="89" y="292.92" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Admin / Organizer</text>
<text x="89" y="334.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">Deploys contract; creates events</text>
<text x="89" y="363.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">Manages sales, checkers and payouts</text>
<path d="M325 385 L325 432" stroke="#64748b" stroke-width="3" fill="none"/>
<polygon points="325,432 318,420 332,420" fill="#64748b"/>
<rect x="620" y="250" width="520" height="135" rx="18" fill="#ffffff" stroke="#d7e0ed" stroke-width="2"/>
<text x="644" y="292.92" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Buyer / Ticket owner</text>
<text x="644" y="334.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">Purchases a specific seat with ETH</text>
<text x="644" y="363.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">Claims refund after cancellation</text>
<path d="M880 385 L880 432" stroke="#64748b" stroke-width="3" fill="none"/>
<polygon points="880,432 873,420 887,420" fill="#64748b"/>
<rect x="1175" y="250" width="520" height="135" rx="18" fill="#ffffff" stroke="#d7e0ed" stroke-width="2"/>
<text x="1199" y="292.92" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Assigned checker</text>
<text x="1199" y="334.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">Checks in tickets for assigned events</text>
<text x="1199" y="363.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">Organizer can also check in tickets</text>
<path d="M1435 385 L1435 432" stroke="#64748b" stroke-width="3" fill="none"/>
<polygon points="1435,432 1428,420 1442,420" fill="#64748b"/>
<rect x="65" y="435" width="1630" height="156" rx="18" fill="#eaf1ff" stroke="#a8c4fa" stroke-width="2"/>
<text x="90" y="468.48" fill="#2563eb" font-family="Arial, sans-serif" font-size="19" font-weight="700">02  INTERACTION / DEVELOPMENT</text>
<text x="90" y="513.52" fill="#0f172a" font-family="Arial, sans-serif" font-size="31" font-weight="700">Remix IDE</text>
<text x="90" y="556.16" fill="#334155" font-family="Arial, sans-serif" font-size="23" font-weight="400">Compile · deploy · call functions · read state · inspect transaction logs</text>
<text x="1035" y="508.24" fill="#1e40af" font-family="Arial, sans-serif" font-size="22" font-weight="700">Remix VM: built-in test accounts</text>
<text x="1035" y="549.24" fill="#1e40af" font-family="Arial, sans-serif" font-size="22" font-weight="400">Sepolia: browser wallet + test ETH</text>
<path d="M880 591 L880 665" stroke="#64748b" stroke-width="3" fill="none"/>
<polygon points="880,665 873,653 887,653" fill="#64748b"/>
<text x="905" y="629.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">ABI calls / signed transactions</text>
<rect x="65" y="668" width="1630" height="438" rx="18" fill="#0f203e" stroke="#0f203e" stroke-width="2"/>
<text x="90" y="704.48" fill="#93c5fd" font-family="Arial, sans-serif" font-size="19" font-weight="700">03  ETHEREUM EVM · REMIX VM OR SEPOLIA</text>
<text x="90" y="754.12" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="700">TicketChain.sol</text>
<text x="90" y="796.16" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="23" font-weight="400">Validates permissions, time windows, seat availability and exact payment</text>
<rect x="90" y="832" width="505" height="143" rx="18" fill="#1d3559" stroke="#3a5578" stroke-width="2"/>
<text x="110" y="873.0" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Event management</text>
<text x="110" y="911.4" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="400">createEvent · setEventSalesPaused</text>
<text x="110" y="941.4" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="400">setChecker · cancelEvent</text>
<rect x="630" y="832" width="505" height="143" rx="18" fill="#1d3559" stroke="#3a5578" stroke-width="2"/>
<text x="650" y="873.0" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Ticket lifecycle</text>
<text x="650" y="911.4" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="400">buyTicket · checkIn</text>
<text x="650" y="941.4" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="400">refundTicket</text>
<rect x="1170" y="832" width="505" height="143" rx="18" fill="#1d3559" stroke="#3a5578" stroke-width="2"/>
<text x="1190" y="873.0" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Settlement &amp; queries</text>
<text x="1190" y="911.4" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="400">withdrawProceeds</text>
<text x="1190" y="941.4" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="400">getEvent · getTicket · paged lists</text>
<text x="90" y="1028.16" fill="#93c5fd" font-family="Arial, sans-serif" font-size="23" font-weight="700">Solidity logs</text>
<text x="90" y="1063.4" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="400">EventCreated · TicketPurchased · TicketCheckedIn · EventCancelled · TicketRefunded · ProceedsWithdrawn</text>
<path d="M440 1106 L440 1170" stroke="#64748b" stroke-width="3" fill="none"/>
<polygon points="440,1170 433,1158 447,1158" fill="#64748b"/>
<path d="M1300 1106 L1300 1170" stroke="#64748b" stroke-width="3" fill="none"/>
<polygon points="1300,1170 1293,1158 1307,1158" fill="#64748b"/>
<rect x="65" y="1173" width="1060" height="230" rx="18" fill="#ffffff" stroke="#d7e0ed" stroke-width="2"/>
<text x="90" y="1209.48" fill="#2563eb" font-family="Arial, sans-serif" font-size="19" font-weight="700">04  ON-CHAIN STATE &amp; ETH</text>
<text x="90" y="1256.0" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Events · Tickets · Seats · Owners · Checker permissions</text>
<text x="90" y="1296.24" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="400">Mappings store records and indexes; getters expose read access.</text>
<text x="90" y="1340.24" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="400">ETH is held in one contract balance.</text>
<text x="90" y="1373.24" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="400">Each event tracks its share using escrowBalance.</text>
<rect x="1160" y="1173" width="535" height="230" rx="18" fill="#fff8e8" stroke="#e4c97f" stroke-width="2"/>
<text x="1185" y="1209.48" fill="#946714" font-family="Arial, sans-serif" font-size="19" font-weight="700">METADATA REFERENCE ONLY</text>
<text x="1185" y="1258.84" fill="#0f172a" font-family="Arial, sans-serif" font-size="27" font-weight="700">metadataURI: string</text>
<text x="1185" y="1299.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">May point to IPFS / HTTPS content.</text>
<text x="1185" y="1336.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">No upload, fetch or content validation</text>
<text x="1185" y="1369.32" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="400">is implemented by the contract.</text>
<text x="65" y="1464.16" fill="#475569" font-family="Arial, sans-serif" font-size="23" font-weight="400">Scope: no frontend, backend, database, NFT standard or ticket-transfer function in this repository.</text>
</svg>